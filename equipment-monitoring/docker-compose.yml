services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: equipment, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipment"]
      interval: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf"]

  api:
    build: ./backend
    ports: ["5000:8080"]
    environment:
      ConnectionStrings__Default: Host=postgres;Database=equipment;Username=postgres;Password=postgres
      Mqtt__Host: mosquitto
      Cors__Origins__0: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }

  simulator:
    build: ./simulator
    environment: { MQTT_URL: "mqtt://mosquitto:1883" }
    depends_on: [mosquitto, api]

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:5000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
